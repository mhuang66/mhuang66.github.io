<!doctype html>
<html lang="en">
    <head>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" type="text/css" href="style.css"/>
        <title>EvolveEats - Meal Prep Mastery</title>
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <link rel="stylesheet" href="https://use.typekit.net/krk7qis.css">

    </head>

    <body class="newsletter">
        <div class="container">

            <header>
                <a href="index.html"><img class="logo" src="images/evolveEats-logo.svg" alt="Evolve Eats."></a>
                <nav class="header">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="#">Recipes</a></li>
                        <li><a href="#">Cooking Techniques</a></li>
                        <li><a href="#">Trending</a></li>
                        <li><a href="#">Community</a></li>
                    </ul>
                </nav>
            </header>

            <main class="newsletter">
                <section>
                    <img src="images/fruit-veg.jpg" alt="">
                    <h2>Subscribe to Our Newsletter</h2>
                    <p>Please provide your contact information</p>
                    <ul class="contact">
                        <li><label for="first-name">First Name:</label> <input type="text" name="first-name" id="first-name" placeholder="Your First Name"></li>
                        <li><label for="last-name">Last Name:</label> <input type="text" name="last-name" id="last-name" placeholder="Your Last Name"></li>
                        <li><label for="email">Email:</label> <input type="email" name="email" id="email" placeholder="Your Email"></li>
                    </ul>
                    <p>Which newsletter(s) are you interested in?</p>
                    <ul class="news-type">
                        <li><input type="checkbox" id="recipe" value="recipe"> <label for="recipe">New Recipes</label></li>
                        <li><input type="checkbox" id="technique" value="technique"> <label for="technique">New Cooking Techniques</label></li>
                        <li><input type="checkbox" id="diet" value="diet"> <label for="diet">Information on Different Diets</label></li>
                    </ul>
                    <p>You agree to receive weekly newsletter emails from EvolveEats.</p>
                    <ul class="news-type">
                        <li><input type="checkbox" id="agree" value="agree"> <label for="agree">I agree</label></li>
                    </ul>
                    <button type="subscribe"><a href="index.html">Subscribe</a></button>
                </section>
            </main>

            <footer>
                <p>© All rights reserved. EvolveEats 2024.</p>
            </footer>

        </div>
    </body>
</html>
